services:
  sqlite-store:
    image: alpine:3.20
    container_name: sqlite-store
    command: >
      sh -c "apk add --no-cache sqlite &&
             mkdir -p /data &&
             touch /data/ventes.db &&
             tail -f /dev/null"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/ventes.db && sqlite3 /data/ventes.db 'PRAGMA quick_check;' | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 10
 
  script-runner:
    build: ./runner
    container_name: script-runner
    depends_on:
      sqlite-store:
        condition: service_healthy
    environment:
      DB_PATH: /data/ventes.db
      SALES_URL: ${SALES_URL}
      PRODUCTS_URL: ${PRODUCTS_URL}
      STORES_URL: ${STORES_URL}
    volumes:
      - sqlite_data:/data
    command: ["python", "app/main.py"]
 
volumes:
  sqlite_data:
